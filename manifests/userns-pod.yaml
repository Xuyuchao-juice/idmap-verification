# User-namespace Pod: the container runtime idmaps every volume, including the JuiceFS PVC.
apiVersion: v1
kind: Pod
metadata:
  name: jfs-userns
  namespace: default
spec:
  hostUsers: false
  terminationGracePeriodSeconds: 5
  containers:
  - name: app
    image: ubuntu:24.04
    command:
    - /bin/sh
    - -c
    - |
      sed -i 's|//.*archive.ubuntu.com|//mirrors.aliyun.com|g' /etc/apt/sources.list.d/ubuntu.sources
      apt-get update -qq && apt-get install -y -qq --no-install-recommends acl attr libcap2-bin e2fsprogs >/dev/null || echo "WARN: tool install failed"
      echo "uid_map: $(cat /proc/self/uid_map)"
      echo READY
      sleep infinity
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: jfs-idmap-pvc
